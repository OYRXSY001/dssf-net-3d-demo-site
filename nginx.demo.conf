# DSSF-Net demo — Nginx reverse proxy template
# 用途：内网/单机演示，同源提供静态前端 + /api、/health 反代后端，避免 CORS。
# 使用前替换：root 路径、backend 端口、server_name/listen。

server {
    listen 8080;
    server_name 127.0.0.1 localhost;

    # 发布时指向 dssf-demo 目录（包含 node_modules/three 实际引用文件）；包移动后请改为实际路径
    root "C:/Users/35864/Desktop/鸡胚光谱检测-3D演示/dssf-demo";
    index index.html;

    # index 不长缓存，便于更新/回滚后生效
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 静态资源（含 ESM importmap 引用的 node_modules/three）
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|mjs|css|map|png|jpg|jpeg|svg|ico|wasm)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # 后端 API（端口按 Backend 实际修改）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
